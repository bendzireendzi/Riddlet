<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#6B7F38"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#8A9E58" stroke-width="12" stroke-opacity="0.4"/>
  
  <!-- Subtle inner background circle -->
  <circle cx="256" cy="256" r="160" fill="#586A2E" fill-opacity="0.3"/>
  
  <!-- Modern Stylized Owl & Letter R Motif -->
  <g fill="#FFFFFF" transform="translate(136, 116)">
    <!-- Owl Eyes / Glasses -->
    <circle cx="70" cy="90" r="38" fill="none" stroke="#FFFFFF" stroke-width="18"/>
    <circle cx="170" cy="90" r="38" fill="none" stroke="#FFFFFF" stroke-width="18"/>
    <path d="M108 90 L132 90" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <circle cx="70" cy="90" r="14" fill="#FFFFFF"/>
    <circle cx="170" cy="90" r="14" fill="#FFFFFF"/>
    
    <!-- Beak -->
    <polygon points="120,118 110,146 130,146" fill="#F4E8C1"/>
    
    <!-- Stylized R / Body -->
    <path d="M40 180 L200 180" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <text x="120" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">RIDDLET</text>
  </g>
</svg>
